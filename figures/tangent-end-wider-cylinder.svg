    <text transform="matrix(1 0 0 1 30 40)" x="0" y="0" xml:space="preserve" font-family="Helvetica-Bold" font-size="20" fill="#000000"><tspan x="0" y="0">A round given a wider coaxial cylinder</tspan></text>
    <text transform="matrix(1 0 0 1 30 62)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">Plan view of the box corner at (10, 10). The r 2 round about (8, 8) is given r 2.3.</tspan></text>
    <text transform="matrix(1 0 0 1 416 236)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">old tangent edge (10, 8)</tspan></text>
    <text transform="matrix(1 0 0 1 416 168)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#1f6fb2"><tspan x="0" y="0">mated vertex (10, 9.136)</tspan></text>
    <text transform="matrix(1 0 0 1 416 304)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">cut at y = 6.864</tspan></text>
    <text transform="matrix(1 0 0 1 250 84)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#1f6fb2"><tspan x="0" y="0">mated vertex (9.136, 10)</tspan></text>
    <text transform="matrix(1 0 0 1 110 100)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">cut at x = 6.864</tspan></text>
    <text transform="matrix(1 0 0 1 30 546)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">The plane x = 10 cuts the cylinder at y = 8 ± 1.136. Only (10, 9.136) is on the corner&apos;s side.</tspan></text>
    <text transform="matrix(1 0 0 1 30 600)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">The arc&apos;s ends are taken from the cuts at 6.864: an arc across the circle&apos;s seam, so no edge.</tspan></text>
    <text transform="matrix(1 0 0 1 30 564)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">Today the tangent edge keeps its old line at (10, 8) and the merge grows</tspan></text>
    <text transform="matrix(1 0 0 1 30 582)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">its tolerance to 0.6, twice the 0.3 gap.</tspan></text>
    <text transform="matrix(1 0 0 1 205 150)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">old tangent edge (8, 10)</tspan></text>
    <text transform="matrix(1 0 0 1 30 528)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">Inner circle: the old round, r 2, tangent to x = 10 and y = 10. Outer circle: the new cylinder, r 2.3.</tspan></text>
    <text transform="matrix(1 0 0 1 30 510)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">Thick arc: the new round face, from the mated vertex (10, 9.136) to (9.136, 10).</tspan></text>
