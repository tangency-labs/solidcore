<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350">
<rect width="900" height="350" fill="white"/><style>text{font:15px sans-serif;fill:#17212b}.title{font-size:20px;font-weight:bold}.grid{stroke:#94a3b8;stroke-width:1.5;fill:none}.iso{stroke:#2563eb;stroke-width:4}.bad{fill:#dc2626}.good{fill:#2563eb}</style>
<text x="25" y="30" class="title">Constant U: curve parameter t varies V</text>
<g transform="translate(0,0)"><text x="65" y="67" class="bad">Before: continuity reads fixed U</text><rect class="grid" x="70" y="100" width="280" height="160"/><line class="grid" x1="70" y1="220" x2="350" y2="220"/><line class="iso" x1="210" y1="100" x2="210" y2="260"/><circle class="bad" cx="70" cy="280" r="5"/><circle class="bad" cx="350" cy="280" r="5"/><text x="100" y="308">2 records versus 3 curve knots → 1006</text></g>
<g transform="translate(450,0)"><text x="65" y="67" class="good">After: continuity follows varying V</text><rect class="grid" x="70" y="100" width="280" height="160"/><line class="grid" x1="70" y1="220" x2="350" y2="220"/><line class="iso" x1="210" y1="100" x2="210" y2="260"/><circle class="good" cx="210" cy="100" r="5"/><circle class="good" cx="210" cy="220" r="5"/><circle class="good" cx="210" cy="260" r="5"/><text x="228" y="105">t=2</text><text x="228" y="225">t=0.5 join</text><text x="228" y="265">t=0</text><text x="100" y="308">3 matching records; join can be solved</text></g>
<text x="25" y="337">Same tensor patch and curve before/after. Transposing U and V gives the constant-V regression.</text></svg>
