# Known mismatches of topology.brep_p7 (format: crates/difftest/src/known.rs).

[[mismatch]]
unit = "topology.brep_p7"
case = "read_plane_square.smb_index1"
why = "edge use 0's type 0 -> 9: C++ builds an inconsistent radial list (status 0, counts 1 1 1 1 4 4); Rust's MakeTopologyFromData returns InvalidInput (radial list links disagree), a documented brep_p10 deviation; C++ SmBrep::ValidatePointers rejects the B-rep its read returned as SM_SUCCESS (WR-470; plan/findings/topology.brep_p7--modified-stream-inconsistent-radial-list.md)"
