why = "SmBrep::SubdivideFaceAtDiscontinuities's V pass counts the U knots (SmBrep.cpp:18483, WR-589): on a sheet with one U knot and two V knots the C++ cuts at the first V knot only (4 faces); solidcore counts the V knots, fixed on the default path (6 faces, crates/solidcore/tests/subdivide_face_v_knots.rs)"

